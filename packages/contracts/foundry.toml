[profile.default]
src = "src"
test = "test"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
[fuzz]
runs = 1000
[invariant]
runs = 256
depth = 128
fail_on_revert = false
