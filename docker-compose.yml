services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stovia
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: stovia
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stovia"]
      interval: 5s
      retries: 10
volumes:
  postgres:
